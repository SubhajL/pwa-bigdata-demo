[project]
name = "pwa-demo-simulator"
version = "0.1.0"
requires-python = ">=3.13"

# Gate config mirrors api/pyproject.toml so `simulator/` is held to the same bar
# as `api/` (CLAUDE.md gate table lists both under the backend column).
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real MQTT broker (docker). Deselect with -m 'not integration'.",
]
