[project]
name = "pwa-demo-api"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
# `pwa_ml` is a sibling package, copied into the image at /srv/pwa_ml (see api/Dockerfile).
# Without this, `ignore_missing_imports` would silently type every model call as `Any` and
# strict mode would be checking nothing across the most important boundary in the slice.
mypy_path = "../ml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs real TimescaleDB / Mosquitto containers. Deselect with -m 'not integration'.",
]
