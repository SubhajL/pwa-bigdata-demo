# Mosquitto — demo broker (slice S0)
# Anonymous listener for the simulated MQTT feed (ผนวก ๑๓ topic ๑).
listener 1883
allow_anonymous true

# WebSocket listener (optional browser diagnostics)
listener 9001
protocol websockets

# Durable sessions: with persistence off, a broker restart discards the subscriber's
# session and any in-flight QoS-1 message, so the outage window is lost outright. The
# subscriber uses a stable client_id with clean_session=False to match.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
