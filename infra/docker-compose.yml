# PWA demo POC — local stack (slice S0)
# Codex #12: images pinned by digest-capable tags; single API worker (Codex #11).
name: pwa-demo

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: pwa
      POSTGRES_PASSWORD: pwa
      POSTGRES_DB: pwa
    ports:
      # Host port is overridable: 5432 is usually taken by a local Postgres and 5433
      # is not reliably free either (an unrelated container held it during S2).
      - "${TSDB_PORT:-5433}:5432"
    volumes:
      # Mount the whole directory, not one file: a fresh volume must receive EVERY
      # NNN_*.sql in order. initdb only runs on an empty data directory, so existing
      # stacks are upgraded by the `migrate` service below instead.
      - ./db:/docker-entrypoint-initdb.d:ro
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwa -d pwa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── one-shot: bring the schema up to date on an EXISTING volume ──────────────
  # initdb is skipped whenever /var/lib/postgresql/data is already populated, so
  # without this anyone who ran the stack before 002 existed would silently run new
  # code against the old schema.
  migrate:
    # Context is the repo root so the image can carry `ml/` (slice S6). All three services
    # that share this image must declare it identically, or compose builds two images.
    build: &api-build
      context: ..
      dockerfile: api/Dockerfile
    command: python /srv/scripts/migrate.py
    environment:
      DATABASE_URL: postgresql://pwa:pwa@timescaledb:5432/pwa
    volumes:
      - ../scripts:/srv/scripts:ro
      - ./db:/srv/infra/db:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  # ── one-shot: seed the device roster BEFORE anything publishes ───────────────
  # telemetry.asset_id is a foreign key to device.asset_id. On a fresh volume the
  # table is empty, so every message would be dead-lettered while the broker and the
  # API both reported healthy. Ordering is enforced, not documented.
  seed:
    build: *api-build
    command: python /srv/scripts/seed_db.py
    environment:
      DATABASE_URL: postgresql://pwa:pwa@timescaledb:5432/pwa
      CURATED_PATH: /srv/data/curated/water_sold_by_branch.csv
    volumes:
      - ../scripts:/srv/scripts:ro
      - ../simulator:/srv/simulator:ro
      - ../data/curated:/srv/data/curated:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ── one-shot: give the model something to look at ───────────────────────────
  # The model scores a 24-hour window; the simulator publishes one signal per device
  # every ~48s, so a live-only stack would take 16 hours to produce its first score and
  # the predictive demo would show `nodata` throughout. This lays down hourly history
  # for a handful of pumps, ending now, so the newest bucket is the only live one.
  # Every backfilled reading is SIMULATED and carries a `backfill-` run_id.
  backfill:
    build: *api-build
    command: python /srv/scripts/backfill_history.py
    environment:
      DATABASE_URL: postgresql://pwa:pwa@timescaledb:5432/pwa
    volumes:
      - ../scripts:/srv/scripts:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *api-build
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      DATABASE_URL: postgresql://pwa:pwa@timescaledb:5432/pwa
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_ENABLED: "1"          # S2: the subscriber is live
      API_RUN_ID: ""             # blank => a fresh id per start (see Settings)
      # Blank => discover the artifact baked into the image at /srv/artifacts/model.pkl.
      MODEL_PATH: ""
      SCORING_ENABLED: "1"       # S6: the periodic scoring pass (item 3.3)
      # P0: the demo-scenario director (POST /api/demo/scenario). Default OFF in the
      # Settings class; ONLY this demo stack turns it on, so the injection surface
      # cannot exist on a production path.
      DEMO_CONTROLS: "1"
      # PR-6: the REAL curated dataset. The image does NOT bake `data/` in (the build
      # context is the repo root, but data/ is deliberately excluded), so it is
      # bind-mounted exactly as `seed` and `simulator` already do.
      CURATED_PATH: /srv/data/curated/water_sold_by_branch.csv
      # PR-H: the pipe-GIS view. Default OFF — dark landing; activation is permission-
      # gated (docs/data/pipe-ry-provenance.md). Enable LOCALLY with PIPE_GIS_ENABLED=1
      # after `make gis-build`; activation also requires the independently approved
      # source fingerprint AND exact PIPE_GIS_APPROVED_BUNDLE_SHA256 printed by the build.
      # The bundle rides the curated bind-mount, and a
      # missing/drifted bundle fails closed to 503 without touching the logical twin.
      PIPE_GIS_ENABLED: "${PIPE_GIS_ENABLED:-0}"
      PIPE_GIS_DIR: /srv/data/curated/pipe_ry
      PIPE_GIS_APPROVED_SOURCE_FINGERPRINT: "${PIPE_GIS_APPROVED_SOURCE_FINGERPRINT:-}"
      PIPE_GIS_APPROVED_BUNDLE_SHA256: "${PIPE_GIS_APPROVED_BUNDLE_SHA256:-}"
      # PR-I/PR-J: the Map Ta Phut 200-customer impact surface. This is the configured demo
      # environment, and its customer-profile readiness contract is met (the seed always lands
      # exactly 200 profiles / 2,400 readings / 140-35-25), so the demo ENABLES it by default —
      # PR-J's clickable footprint → drawer → 200 → detail journey is the scored surface here.
      # The application Settings default is still False (production/non-demo stays dark: enriched
      # impact, the per-customer route, and the impact-zone route 404 until enabled). Override to 0
      # for a deliberately dark stack. Note: PIPE_GIS_ENABLED (the real Rayong map) stays 0 — it
      # needs the permission-gated local bundle; the impact-zone footprint does NOT.
      MTP_CUSTOMER_IMPACT_ENABLED: "${MTP_CUSTOMER_IMPACT_ENABLED:-1}"
      MTP_CUSTOMER_PROFILE: "${MTP_CUSTOMER_PROFILE:-mtp-low-pressure-200-v1}"
      # Browser origins allowed to call the API cross-origin. In the normal setup the
      # Vite proxy makes the browser same-origin and this never fires; it covers a judge
      # calling the API directly on :8000.
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}"
    volumes:
      # The `api` service had NO volumes before PR-6, which is why the curated read API
      # could not have worked however it was written.
      - ../data/curated:/srv/data/curated:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      backfill:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build: ../simulator
    command: python -m app.publish
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # The roster is derived from the real branch CSV, which is bind-mounted
      # rather than baked into the image (data/ is outside the build context).
      CURATED_PATH: /srv/data/curated/water_sold_by_branch.csv
      # Blank => a fresh uuid per container start, so message_ids never collide
      # across restarts. The demo director pins this to label a scenario run.
      # NOTE: an empty env var is still "provided" to pydantic-settings, so the
      # blank is normalised back to a generated id by SimSettings._reject_blank_run_id.
      RUN_ID: "${RUN_ID:-}"
      # Overridable from the environment so a demo scenario can inject a fault
      # without editing this file: FAULT_MODE=bad_asset docker compose up simulator
      FAULT_MODE: "${FAULT_MODE:-normal}"   # normal | anomaly | pressure_drop | bad_asset | malformed
      RATE_HZ: "${RATE_HZ:-5}"
    volumes:
      - ../data/curated:/srv/data/curated:ro
    # Scored item 1.2 is demonstrated by restarting the broker. The producer must
    # come back with it, or there is no traffic left to show the consumer recovered.
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # NO profile: the publisher now starts with the stack. S1 kept it on-demand because
    # nothing depended on live traffic, but S6's window contract does — `backfill` is a
    # ONE-SHOT whose newest reading ages out after `features.MAX_STALENESS_S` (300s).
    # Behind a profile, `docker compose up` gave a stack that scored for five minutes and
    # then reported `nodata` for every device for the rest of the session, which is most of
    # topic ๓ silently unscoreable.

  web:
    build: ../web
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      # EMPTY on purpose. The app issues RELATIVE /api and /ws requests and the Vite dev
      # proxy forwards them, so the browser is same-origin. The old absolute value sent
      # the twin WebSocket to Vite instead of FastAPI, and nothing could connect.
      VITE_API_BASE: ""
      # Where that proxy forwards to. `api` resolves only inside this compose network;
      # a host-side `pnpm dev` falls back to http://localhost:8000 (see web/vite.config.ts).
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    # NO profile as of PR-6. Behind `profiles: ["ui"]` a plain `docker compose up` brought
    # up no frontend at all, so the proxy this PR adds would never have been exercised —
    # and from PR-7 the UI is where the scored items are actually demonstrated.

volumes:
  tsdb-data:
  mosquitto-data:
